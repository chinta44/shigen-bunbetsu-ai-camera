name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Auto Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Prepare environment configuration
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Extract App Version
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Target version: $VERSION"

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare Release APK binary
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/*.apk "release-apk/shigen-bunbetsu-ai-camera-v${{ env.APP_VERSION }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "shigen-bunbetsu-ai-camera-v${{ env.APP_VERSION }}-debug-apk"
          path: release-apk/*.apk
          retention-days: 14

      - name: Publish or Update GitHub Release and Attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.APP_VERSION }}"
          name: "v${{ env.APP_VERSION }}"
          files: release-apk/*.apk
          generate_release_notes: true
